<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#06122b">
    <meta name="description" content="CV de Joy-floris Guérin, BUT Réseaux et Télécoms, parcours cybersécurité.">
    <title>CV Joy-floris Guérin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3EJG%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <main class="container">
        <!-- Section de gauche avec le CV -->
        <figure class="cv-container">
            <a href="cv_joy.jpg?v=4" target="_blank" rel="noopener" class="cv-link" aria-label="Agrandir le CV">
                <img src="cv_joy.jpg?v=4" alt="CV Joy-floris Guérin" width="1414" height="2000">
                <span class="zoom-hint">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4a1 1 0 0 1-1.42 1.4l-5.39-5.38A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm0 2a1 1 0 0 1 1 1v2h2a1 1 0 1 1 0 2h-2v2a1 1 0 1 1-2 0v-2H7a1 1 0 1 1 0-2h2V7a1 1 0 0 1 1-1z"/></svg>
                    Agrandir
                </span>
            </a>
        </figure>

        <!-- Section de droite avec les actions -->
        <aside class="right-section">
            <header class="intro">
                <div class="avatar" aria-hidden="true">JG</div>
                <div>
                    <p class="eyebrow">Curriculum vitæ</p>
                    <h1>Joy-floris Guérin</h1>
                    <p class="subtitle">BUT Réseaux &amp; Télécoms · Cybersécurité</p>
                </div>
            </header>

            <section class="block">
                <h2>Liens</h2>
                <a href="https://linkedin.com/in/joy-guerin/" target="_blank" rel="noopener" class="btn btn-secondary">
                    <span class="btn-icon linkedin" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
                    </span>
                    <span class="btn-label">LinkedIn</span>
                    <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
                </a>
            </section>

            <section class="block">
                <h2>Télécharger le CV</h2>
                <form id="download-form" action="https://formspree.io/" method="POST" target="_self">
                    <label for="email">Votre email</label>
                    <input type="email" id="email" name="email" placeholder="vous@exemple.com" autocomplete="email" required>

                    <!-- Champ caché pour personnaliser l'objet du mail -->
                    <input type="hidden" name="_subject" value="Nouveau téléchargement de CV !">

                    <button type="submit" class="btn btn-primary">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
                        <span>Télécharger le PDF</span>
                    </button>
                    <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
                </form>
            </section>
        </aside>
    </main>

    <!-- Footer -->
    <footer>
        <p>© 2025 Guérin Joy-floris. Tous droits réservés.</p>
    </footer>

    <script src="script.js?v=4"></script>
</body>
</html>
